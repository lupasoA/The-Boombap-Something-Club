        <h1 id="page-title">Event Planning</h1>
        <p class="lead"><strong>想いを、特別な一日に。</strong></p>
        <p>イベントには、人を集めるだけではなく、人と人をつなぎ、心を動かす力があります。</p>
        <p>企画・構成から会場づくり、演出、当日の運営まで、目的や想いに合わせたイベントをトータルでプロデュース。</p>
        <p>地域イベントやお祭り、企業イベント、ステージ企画など、それぞれの「やりたい」をカタチにし、その日、その場所でしか生まれない体験をつくります。</p>
        <p>参加する人の記憶に残り、次のつながりへと広がっていく。そんなイベントを一緒につくります。</p>
